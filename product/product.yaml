_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "One flight request, a university system's real travel policy: book it, refuse it, or hold it for sign-off"
summary: "An agent handles one traveller's flight request under the University of Nebraska Travel Policy (effective 2018, last revised March 7, 2019), read verbatim. It reads the trip record, searches a simulated flight world (real airports and airlines, synthetic schedules and fares) and submits a decision with the offer, cabin, reason, approver and policy section. A deterministic verifier rebuilds the offers and the policy's answer itself and checks every field. Twenty-four cases cover the approvals a trip needs before booking, travel abroad, the coach-price cap to the cent, landing deadlines, buying outside the agency, chartered planes, speakers, accommodation plans, companions and personal side trips, and the policy's own unclear words."
highlights:
  - "The verbatim policy: no paraphrase, no rules restated in the task"
  - "Exact boundaries: a premium fare equal to the coach price against one dollar over it"
  - "Approvals checked by role, and unclear clauses held for approval once, with clear twins on both sides"
  - "Fully offline: a hash-seeded flight world with unguessable offer ids"
steps:
  - "Name a case, for example birch-lantern, with the traveller's request"
  - "The agent reads the trip record and searches flights on the trip's route and date"
  - "It submits BOOK, REFUSE or FLAG_FOR_APPROVAL with the offer, cabin, reason, approver and section"
  - "The verifier recomputes the policy's answer and checks every field"
